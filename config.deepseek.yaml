# AI Agent 配置文件 - DeepSeek 示例

# LLM 提供商: ollama 或 deepseek
provider: deepseek

# Ollama 配置（用于 embedding，DeepSeek 不支持 embedding）
ollama:
  base_url: http://127.0.0.1:11434
  chat_model: gemma3:12b
  embed_model: nomic-embed-text

# DeepSeek 配置
deepseek:
  base_url: https://api.deepseek.com
  api_key: "sk-b42fde7257a649ac82b53c118d463dba"  # 在这里填入你的 DeepSeek API Key
  chat_model: deepseek-chat

# Qdrant 向量数据库配置
qdrant:
  base_url: http://127.0.0.1:6333
  collection: memories
  api_key: "your_api_key_here"
  top_k: 6

# SQLite 数据库配置
database:
  path: memory.db

# 记忆配置
memory:
  window_size: 5
  extractor_model: ""  # 留空则使用 deepseek-chat
  enable_smart_trigger: true  # 启用智能触发（节省 70-80% token）
  trigger_method: "conservative"  # 触发方法: keyword, llm, conservative
  classifier_model: "qwen2.5:0.5b"  # LLM 分类器模型（仅 llm 方法使用）
  min_message_length: 10      # 最小消息长度
  include_history_context: false  # 提取时包含历史上下文（false 避免重复提取）

# 调试模式
debug: false

# 超时时间（秒）
timeout: 60
